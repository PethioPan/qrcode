<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Page Not Found</title>
  <script type="text/javascript">
    // Get the base URL path from GitHub Pages (e.g., /qrcode/)
    var basepath = '{{ site.baseurl }}';
    // Fallback for local testing if Liquid tag doesn't process
    if (!basepath || basepath === '/') {
      basepath = '/qrcode/'; // <-- Manually set your repo name here as a fallback
    }
    // Ensure basepath ends with a slash
    if (!basepath.endsWith('/')) {
      basepath += '/';
    }

    // Redirect to the base URL. React Router will handle the rest.
    window.location.replace(basepath);

  </script>
</head>
<body>
<p>Redirecting...</p>
<a href="/qrcode/">Go to Homepage</a> {/* Fallback link */}
</body>
</html>
